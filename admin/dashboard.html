<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard - Secadiven Admin</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b1322;color:#dbe2f8;min-height:100vh}
    .topbar{background:#141c2b;border-bottom:1px solid #222a3a;padding:0.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
    .topbar h2{font-size:1.1rem;color:#e8c268}
    .topbar .user{display:flex;align-items:center;gap:1rem;font-size:0.85rem;color:#b8c5d6}
    .topbar .btn-sm{padding:0.4rem 1rem;font-size:0.8rem;background:#222a3a;border:1px solid #2d3545;color:#b8c5d6;border-radius:6px;cursor:pointer;transition:all 0.2s}
    .topbar .btn-sm:hover{background:#2d3545;color:#fff}
    .container{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
    h3{font-size:1.3rem;margin-bottom:1.5rem;color:#e8c268}
    .upload-zone{border:2px dashed #2d3545;border-radius:12px;padding:3rem 2rem;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:2rem;background:#141c2b}
    .upload-zone:hover,.upload-zone.dragover{border-color:#c8a44e;background:rgba(200,164,78,0.05)}
    .upload-zone p{color:#6b7280;font-size:0.95rem}
    .upload-zone .icon{font-size:3rem;margin-bottom:1rem;display:block}
    .upload-zone input{display:none}
    .upload-row{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap;justify-content:center}
    .upload-row input[type="text"]{flex:1;min-width:200px;max-width:400px;padding:0.6rem 0.8rem;border-radius:6px;background:#0b1322;border:1px solid #2d3545;color:#dbe2f8;font-size:0.9rem;outline:none}
    .upload-row input[type="text"]:focus{border-color:#c8a44e}
    .btn{padding:0.7rem 1.5rem;border:none;border-radius:6px;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s}
    .btn-primary{background:linear-gradient(135deg,#e8c268,#c8a44e);color:#0b1322}
    .btn-primary:hover{box-shadow:0 4px 16px rgba(200,164,78,0.3)}
    .btn-primary:disabled{opacity:0.5;cursor:not-allowed}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin-top:1.5rem}
    .gallery-item{position:relative;border-radius:8px;overflow:hidden;background:#141c2b;border:1px solid #222a3a;transition:all 0.2s}
    .gallery-item:hover{border-color:#c8a44e}
    .gallery-item img{width:100%;height:200px;object-fit:cover;display:block}
    .gallery-item .info{padding:0.75rem}
    .gallery-item .caption{font-size:0.85rem;color:#b8c5d6;word-break:break-word}
    .gallery-item .actions{display:flex;gap:0.5rem;padding:0 0.75rem 0.75rem}
    .btn-del{flex:1;padding:0.5rem;border-radius:4px;border:1px solid rgba(255,0,0,0.2);background:rgba(255,0,0,0.1);color:#ff6b6b;font-size:0.8rem;cursor:pointer;transition:all 0.2s}
    .btn-del:hover{background:rgba(255,0,0,0.2)}
    .msg{position:fixed;top:1rem;right:1rem;padding:1rem 1.5rem;border-radius:8px;font-size:0.9rem;z-index:100;animation:slideIn 0.3s ease;display:none}
    .msg.success{background:#065f46;color:#6ee7b7;display:block}
    .msg.error{background:#7f1d1d;color:#fca5a5;display:block}
    @keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
    .empty{text-align:center;padding:3rem;color:#6b7280;grid-column:1/-1}
    .loading{text-align:center;padding:2rem;color:#6b7280;grid-column:1/-1}
    .counter{color:#6b7280;font-size:0.85rem;margin-bottom:1rem}
  </style>
</head>
<body>
  <div class="topbar">
    <h2>📸 Gestión de Galería</h2>
    <div class="user">
      <span id="usernameDisplay"></span>
      <a href="/" target="_blank" class="btn-sm">Ver sitio</a>
      <button class="btn-sm" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>

  <div class="container">
    <!-- Upload zone -->
    <h3>Subir nueva foto</h3>
    <div class="upload-zone" id="dropZone">
      <span class="icon">📁</span>
      <p>Arrastra una imagen aquí o haz clic para seleccionar</p>
      <p style="font-size:0.8rem;margin-top:0.5rem">JPG, PNG, WebP — Máx 10MB</p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif">
      <div class="upload-row">
        <input type="text" id="captionInput" placeholder="Descripción de la foto (opcional)">
        <button class="btn btn-primary" id="uploadBtn" disabled>Subir imagen</button>
      </div>
    </div>

    <!-- Message toast -->
    <div class="msg" id="msg"></div>

    <!-- Gallery list -->
    <h3>Galería actual <span class="counter" id="imgCounter"></span></h3>
    <div class="gallery-grid" id="galleryGrid">
      <div class="loading">Cargando galería...</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('admin_token');
    if (!token) { window.location = '/admin/'; }

    // Auth check
    fetch('/api/auth/check', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(d => { document.getElementById('usernameDisplay').textContent = '👤 ' + d.username; })
      .catch(() => { localStorage.removeItem('admin_token'); window.location = '/admin/'; });

    // Elements
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const captionInput = document.getElementById('captionInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const galleryGrid = document.getElementById('galleryGrid');
    const imgCounter = document.getElementById('imgCounter');
    const msgEl = document.getElementById('msg');

    let selectedFile = null;

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = 'msg ' + type;
      setTimeout(() => msgEl.className = 'msg', 3000);
    }

    function loadGallery() {
      fetch('/api/galeria')
        .then(r => r.json())
        .then(data => {
          const images = data.images || [];
          imgCounter.textContent = '(' + images.length + ' fotos)';
          
          if (images.length === 0) {
            galleryGrid.innerHTML = '<div class="empty">No hay fotos en la galería. ¡Sube la primera!</div>';
            return;
          }
          
          galleryGrid.innerHTML = images.map((img, i) => `
            <div class="gallery-item">
              <img src="${img.src}" alt="${img.caption}" loading="lazy">
              <div class="info"><span class="caption">${img.caption || 'Sin descripción'}</span></div>
              <div class="actions">
                <button class="btn-del" onclick="deleteImage(${i})">🗑 Eliminar</button>
              </div>
            </div>
          `).join('');
        })
        .catch(() => galleryGrid.innerHTML = '<div class="empty">Error al cargar galería</div>');
    }

    async function deleteImage(index) {
      if (!confirm('¿Eliminar esta foto permanentemente?')) return;
      try {
        const res = await fetch('/api/galeria/' + index, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error();
        showMsg('Foto eliminada', 'success');
        loadGallery();
      } catch(e) {
        showMsg('Error al eliminar', 'error');
      }
    }

    // Upload flow
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        selectedFile = e.dataTransfer.files[0];
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Subir: ' + selectedFile.name;
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        selectedFile = fileInput.files[0];
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Subir: ' + selectedFile.name;
      }
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Subiendo...';
      
      const formData = new FormData();
      formData.append('image', selectedFile);
      formData.append('caption', captionInput.value);
      
      try {
        const res = await fetch('/api/galeria/upload', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: formData
        });
        if (!res.ok) { const d = await res.json(); throw new Error(d.error); }
        showMsg('¡Foto subida!', 'success');
        selectedFile = null;
        fileInput.value = '';
        captionInput.value = '';
        uploadBtn.disabled = true;
        uploadBtn.textContent = 'Subir imagen';
        loadGallery();
      } catch(e) {
        showMsg(e.message || 'Error al subir', 'error');
        uploadBtn.disabled = false;
        uploadBtn.textContent = selectedFile ? 'Subir: ' + selectedFile.name : 'Subir imagen';
      }
    });

    function logout() {
      localStorage.removeItem('admin_token');
      window.location = '/admin/';
    }

    loadGallery();
  </script>
</body>
</html>
