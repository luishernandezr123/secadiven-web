<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog y noticias del Seminario Teológico Secadiven Internacional. Artículos, eventos y novedades.">
  <meta property="og:title" content="Blog - Seminario Teológico Secadiven Internacional">
  <meta property="og:description" content="Artículos, noticias y novedades del seminario.">
  <title>Blog - Seminario Teológico Secadiven Internacional</title>
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap#38;family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap#38;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css?v=2.0">
  <style>
    .blog-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    @media (max-width: 480px) { .blog-list { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido</a>
  <header class="site-header" id="site-header" role="banner"></header>

  <main id="main-content">
    <div class="page-header">
      <div class="container">
        <h1>Blog / Noticias</h1>
        <p>Artículos, eventos y novedades de la comunidad Secadiven</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="blog-list" id="blog-list">
          <p style="text-align:center;grid-column:1/-1;color:var(--color-text-light)">Cargando artículos...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer" role="contentinfo"></footer>
  <a href="#" class="whatsapp-float" id="whatsapp-float" target="_blank" rel="noopener" aria-label="Contactar por WhatsApp"></a>

  <script src="/assets/js/main.js?v=2.0"></script>
  <script src="/assets/js/blog.js?v=2.0"></script>
  <script>
    /* Blog listing */
    document.addEventListener('DOMContentLoaded', function() {
      var list = document.getElementById('blog-list');
      if (!list) return;

      var posts = [
        { slug: 'bienvenida-nuevo-ciclo', file: '../content/blog/bienvenida-nuevo-ciclo.md' },
        { slug: 'graduacion-2026', file: '../content/blog/graduacion-2026.md' },
        { slug: 'conferencia-teologica', file: '../content/blog/conferencia-teologica.md' }
      ];

      var fetched = 0;
      var postData = [];

      if (posts.length === 0) {
        list.innerHTML = '<div class="empty-state"><p>Pr&oacute;ximamente publicaremos art&iacute;culos y noticias. Mantente al tanto.</p></div>';
        return;
      }

      posts.forEach(function(post) {
        fetch(post.file)
          .then(function(r) { return r.text(); })
          .then(function(text) {
            var parsed = BlogUtils.parseFrontmatter(text);
            postData.push({
              slug: post.slug,
              titulo: parsed.meta.titulo || 'Sin t&iacute;tulo',
              fecha: parsed.meta.fecha || '',
              autor: parsed.meta.autor || '',
              extracto: parsed.meta.extracto || '',
              imagen: parsed.meta.imagen || ''
            });
          })
          .catch(function() {
            /* skip missing files */
          })
          .finally(function() {
            fetched++;
            if (fetched === posts.length) {
              renderBlogList();
            }
          });
      });

      function renderBlogList() {
        if (postData.length === 0) {
          list.innerHTML = '<div class="empty-state"><p>No se pudieron cargar los art&iacute;culos. Intenta de nuevo m&aacute;s tarde.</p></div>';
          return;
        }

        /* Sort by date descending */
        postData.sort(function(a, b) { return b.fecha.localeCompare(a.fecha); });

        list.innerHTML = '';
        postData.forEach(function(post) {
          var card = document.createElement('article');
          card.className = 'blog-card';
          card.innerHTML =
            (post.imagen ? '<img class="blog-card-img" src="' + post.imagen + '" alt="' + post.titulo + '" loading="lazy">' :
             '<div class="blog-card-img" style="background:var(--color-bg-alt);display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--color-text-light)">&#9998;</div>') +
            '<div class="blog-card-body">' +
            '<span class="date">' + BlogUtils.formatDate(post.fecha) + '</span>' +
            '<h3><a href="entrada.html?post=' + post.slug + '">' + post.titulo + '</a></h3>' +
            '<p>' + post.extracto + '</p>' +
            '</div>';
          list.appendChild(card);
        });
      }
    });
  </script>
</body>
</html>
