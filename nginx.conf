server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/html application/json;
    gzip_min_length 512;

    # Cache de assets estaticos (1 hora, revalidate)
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Paginas HTML sin cache fuerte
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Seguridad basica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
